<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Favicon Transparencia Venezuela: escudo (confianza) + check (verificado) sobre navy, acento dorado -->
  <rect width="32" height="32" rx="7" fill="#0a1628"/>
  <!-- escudo -->
  <path d="M16 4.5l8 3v6.2c0 5.4-3.4 9.1-8 11-4.6-1.9-8-5.6-8-11V7.5l8-3z"
        fill="none" stroke="#d4b87c" stroke-width="2" stroke-linejoin="round"/>
  <!-- check de verificación -->
  <path d="M11.7 16.2l3 3 5.6-6.4" fill="none" stroke="#3fae6f"
        stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
